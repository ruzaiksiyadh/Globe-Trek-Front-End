<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — GlobeTrek</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body style="background:var(--navy-950);">

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; position:relative; overflow:hidden;">
  <div style="position:absolute; inset:0; background:var(--grad-glow);"></div>
  <div class="glass" style="max-width:420px; width:100%; padding:44px; position:relative; z-index:1;">
    <div class="text-center" style="margin-bottom:30px;">
      <a href="index.html" class="nav-logo" style="justify-content:center; display:inline-flex;">Globe<span>Trek</span></a>
      <h2 style="color:#fff; margin-top:18px;">GlobeTrek Admin</h2>
      <p style="color:rgba(255,255,255,.65); margin-top:6px;">Restricted access. Authorized administrators only.</p>
    </div>
    <form id="admin-login-form" novalidate>
      <div class="form-group">
        <label style="color:#fff;">Admin Email / Username</label>
        <input type="email" id="admin-email" class="form-control" style="background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.25); color:#fff;" placeholder="admin@globetrek.com" required>
        <div class="field-error">Please enter a valid email.</div>
      </div>
      <div class="form-group">
        <label style="color:#fff;">Password</label>
        <input type="password" id="admin-password" class="form-control" style="background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.25); color:#fff;" placeholder="••••••••" required>
        <div class="field-error">Password is required.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="padding:16px;">Admin Login</button>
    </form>
    <div class="glass mt-24" style="padding:14px 16px; background:rgba(255,255,255,.06);">
      <p style="font-size:.76rem; color:rgba(255,255,255,.6);"><strong style="color:#67e8f9;">Demo credentials:</strong> admin@globetrek.com / Admin@2026</p>
    </div>
    <p class="text-center mt-24" style="font-size:.82rem;"><a href="index.html" style="color:rgba(255,255,255,.55);">← Back to GlobeTrek</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async ()=>{
  const user = await currentUser();
  if(user && user.role==='Admin'){ window.location.href = 'admin-dashboard.html'; return; }

  const form = document.getElementById('admin-login-form');
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('admin-email');
    const password = document.getElementById('admin-password');
    email.classList.remove('invalid'); password.classList.remove('invalid');

    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Verifying…';
    const result = await loginUser(email.value.trim(), password.value, 'Admin');
    btn.disabled = false; btn.textContent = 'Admin Login';

    if(!result.ok){
      showToast('Access denied', result.error, 'error');
      email.classList.add('invalid'); password.classList.add('invalid');
      return;
    }
    showToast('Welcome, Admin', 'Loading dashboard…', 'success');
    setTimeout(()=>{ window.location.href = 'admin-dashboard.html'; }, 600);
  });
});
</script>
</body>
</html>
