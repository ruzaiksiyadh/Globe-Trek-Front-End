<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — GlobeTrek</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app-navbar" data-home="index.html"></div>

<div class="dash-shell">
  <div class="container">
    <div class="dash-header">
      <div>
        <div class="eyebrow" style="color:#67e8f9;">My Account</div>
        <h2 id="welcome-msg" style="color:#fff;">Welcome back!</h2>
        <p style="color:rgba(255,255,255,.8); margin-top:6px;">Manage your bookings and profile in one place.</p>
      </div>
      <a href="index.html#tours" class="btn btn-ghost">Explore More Tours</a>
    </div>

    <div class="dash-tabs">
      <button class="dash-tab active" data-tab="bookings">My Bookings</button>
      <button class="dash-tab" data-tab="profile">Profile</button>
    </div>

    <div class="dash-panel active" id="panel-bookings">
      <div id="bookings-list"></div>
    </div>

    <div class="dash-panel" id="panel-profile">
      <div class="glass" style="background:#fff; border:1px solid #e4eef8; padding:34px; max-width:560px;">
        <h3 style="margin-bottom:22px;">Edit Profile</h3>
        <form id="profile-form">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="p-name" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="p-email" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="p-phone" class="form-control">
          </div>
          <div class="form-group">
            <label>Country</label>
            <input type="text" id="p-country" class="form-control">
          </div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </div>
    </div>
  </div>
</div>

<div id="app-footer" data-home="index.html"></div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
function statusBadge(status){
  const map = {
    Pending: ['pending', '<span class="pulse-beacon" style="width:11px;height:11px;display:inline-flex;margin-right:2px;"><span class="beacon-ring"></span><span class="beacon-dot" style="width:7px;height:7px;"></span></span>'],
    Approved: ['approved', '<span class="status-dot"></span>'],
    Rejected: ['rejected', '<span class="status-dot"></span>']
  };
  const [cls, icon] = map[status] || ['pending', '<span class="status-dot"></span>'];
  return `<span class="status ${cls}">${icon} ${status}</span>`;
}

async function renderBookings(){
  const bookings = await getBookingsForUser();
  const list = document.getElementById('bookings-list');
  if(!bookings.length){
    list.innerHTML = `
      <div class="empty-state glass" style="background:#fff; border:1px solid #e4eef8;">
        <h3>No bookings yet</h3>
        <p class="mt-8">Your next adventure is waiting to be booked.</p>
        <a href="index.html#tours" class="btn btn-primary mt-16">Browse Tours</a>
      </div>`;
    return;
  }
  list.innerHTML = bookings.map(b=>`
    <div class="booking-row">
      <img src="${b.tourImg}" alt="${b.tourName}">
      <div class="info">
        <h4>${b.tourName}</h4>
        <div class="meta">
          <span>📍 ${b.location}</span>
          <span>📅 ${b.travelDate}</span>
          <span>👥 ${b.travelers} traveler${b.travelers>1?'s':''}</span>
          <span>Ref: ${b.reference}</span>
        </div>
        ${b.status==='Rejected' && b.rejectionReason ? `<div style="font-size:.8rem; color:#c0392b; margin-top:6px;">Reason: ${b.rejectionReason}</div>` : ''}
      </div>
      <div class="text-center">${statusBadge(b.status)}</div>
      <div class="price">${fmtMoney(b.totalPrice)}</div>
    </div>`).join('');
}

document.addEventListener('DOMContentLoaded', async ()=>{
  const user = await requireAuth('dashboard.html');
  if(!user) return;

  document.getElementById('welcome-msg').textContent = `Welcome back, ${user.fullName.split(' ')[0]}!`;
  renderBookings();

  document.getElementById('p-name').value = user.fullName;
  document.getElementById('p-email').value = user.email;
  document.getElementById('p-email').setAttribute('readonly', 'true');
  document.getElementById('p-email').title = 'Email changes aren\'t supported yet';
  document.getElementById('p-phone').value = user.phone || '';
  document.getElementById('p-country').value = user.country || '';

  document.querySelectorAll('.dash-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.dash-tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.dash-panel').forEach(p=>p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-'+tab.dataset.tab).classList.add('active');
    });
  });

  document.getElementById('profile-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const result = await updateProfile({
      fullName: document.getElementById('p-name').value.trim(),
      phone: document.getElementById('p-phone').value.trim(),
      country: document.getElementById('p-country').value.trim()
    });
    if(!result.ok){
      showToast('Update failed', result.error || 'Please try again.', 'error');
      return;
    }
    showToast('Profile updated', 'Your changes have been saved.', 'success');
    document.getElementById('welcome-msg').textContent = `Welcome back, ${result.user.fullName.split(' ')[0]}!`;
  });
});
</script>
</body>
</html>
